[mod]
id = "fastaudioreload"
name = "Fast Audio Reload"
description = "Reloads only the Minecraft audio engine instead of reloading every resource. Also watches audio devices and reconnects automatically."
group = "dev.fastaudioreload"
version = "1.0.0"
author = "exxooqu"
license = "MIT"
website_url = "https://github.com/exxooqu-cpu/fast-audio-reload"
source_url = "https://github.com/exxooqu-cpu/fast-audio-reload"
issue_tracker = "https://github.com/exxooqu-cpu/fast-audio-reload/issues"
icon = "assets/fastaudioreload/icon.png"

# Fabric loader 0.16.x is the last line that still runs on Java 8, which is what
# 1.16.x users have. Newer nodes override this below.
[fabric]
deps.fabric-loader = "0.16.14"
dep_str.fabric-loader = ">=0.14.0"

